            Replaces the binary hydraulic mortality switch at hf_sm_threshold
            with a linear ramp. Same patch as R4 (current).
        - id: "prescribed-puptake-fix"
          file: "biogeochem/FatesSoilBGCFluxMod.F90"
          line: 202
          summary: |
            prescribed_nuptake(pft) → prescribed_puptake(pft) in daily_p_gain.
            CRITICAL for R5: this patch is what makes
            fates_cnp_prescribed_puptake=1.0 actually deliver "P at full
            demand". Without it, the param value would be ignored and the
            magnitude would silently read from prescribed_nuptake (which is
