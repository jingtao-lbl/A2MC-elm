    changes_from_previous:
      # vs R4 (current Morris ADSPSupNP)
      - "Protocol vs R4: ADSP_SUPLPHOS ALL→NONE; ADSP_SUPLNITRO ALL→NONE. ALL phases now run with NO nutrient supplementation."
      - "Override added: fates_cnp_prescribed_puptake = 1.0 (all 12 PFTs). Combined with the FATES prescribed-puptake-fix patch, delivers P uptake at daily demand rate throughout ADSP+RGSP+TRANS."
      - "Sampling unchanged: full 4890-case Morris on the same X matrix (FATES_CNPnPlantTraits_162param_Morris_4890sets.txt). Same parameter draws across R2/R3/R4/R5; only protocol + overrides differ — enables clean within-case paired comparison."
      - "Parameter files: new dir <NERSC_HOME>/E3SM_Aid/FATES-ParameterFiles/fates_params_PrescribedP_EnPlantTraitsCNPparam162 (built by phases/phase0_design/apply_param_override.py from R3's non-prescribed dir with prescribed_puptake=1.0 applied; 4890 NCs, 384MB)"
      - "FATES build reused from R4 (fates-cnp-eca-tj). The prescribed-puptake-fix patch is the FIRST patch that actually matters for any A2MC round: R4 doesn't use prescribed-P mode so the patch is a no-op there; R5 turns the patch on for the first production use."
      - "Case-dir suffix: PrescP (matches old superseded R4). R4-new uses ADSPSupNP — no collision."
    rationale: >
      Two findings from R4 motivate R5: (1) the fine-root re-allocation
      pathology under N supplementation means future N-supp variants will
      deepen the same trade-off, not resolve it; (2) "fully prescribed P
      uptake" has never been cleanly tested in any A2MC round (the old
      R4 subset_replay attempted this but a FATES source quirk + the
      A2MC ensemble generator's zero-fill of prescribed_nuptake combined
      to deliver P uptake = ZERO during TRANS instead of full demand).

      R5 is the first attempt to cleanly answer "is P availability the
      bottleneck for PFT10?" To do so without confounds:
        - Turn OFF ALL nutrient supplementation (no fattening-then-
          starving cycle from R4's ADSP_SUPLNITRO=ALL).
        - Prescribe P uptake at full demand throughout via the parameter
          override (works correctly because the FATES build has the
          prescribed-puptake-fix patch).
        - Leave N coupled (from soil ECA dynamics). If PFT10 still fails
          despite full-demand P, the bottleneck is NOT P-availability
          — it's allocation/light/turnover/etc.

      Risk acknowledged: removing ADSP_SUPLNITRO=ALL means N is solely
      coupled during AD spinup. Per R3 iter07 diagnosis, this was the
      identified bottleneck for PFT10 establishment. If R5 shows PFT10
      still fails despite P prescription, that result is consistent
      with EITHER (a) N limits PFT10 during ADSP, OR (b) the bottleneck
      is elsewhere. A follow-up round prescribing BOTH N and P would
      disentangle further if needed.

      Expected R5 outcome shape: if P-availability is the PFT10
      bottleneck, mean PFT10 leaf and fineroot biomass rise substantially
      vs R2 (which has the same protocol baseline, coupled P). If P
      availability is NOT the bottleneck, R5 biomass distributions look
      similar to R2 across all 3 PFTs — telling us future calibration
      should target allocation parameters (l2fr_10,
      alloc_storage_cushion_10, fates_recruit_init_density_10) rather
      than nutrient pathways.
