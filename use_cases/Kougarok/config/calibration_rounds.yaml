      as Round 2 to isolate the effect of the protocol change.
    outcome: null
    status: in_progress

  4_subset_replay_PrescP_superseded:
    # SUPERSEDED on 2026-04-28. The R4 slot has been redesigned to a full
    # Morris ensemble with ADSP N+P supplementation (see entry "4:" below).
    # This entry preserves the original R4 design for audit / manuscript
    # reference. It uses a non-integer YAML key so the orchestrator's
    # `rounds.get(4)` lookup will not pick it up.
    #
    # Why superseded: R4 produced inconclusive results — Bug 5 (Phase 4
    # round-aware Y matrix loader, fixed in v2.85) contaminated all
    # skip-testing correlations with R3 Morris data mislabeled as R4, and
    # the LABILEP-litter-trap mechanism (discoveries
    # litter_p_accumulation_not_loss / drought_decomposition_coupling)
    # was identified as the actual driver of LABILEP depletion during
    # TRANS — meaning prescribed_puptake=1.0 was not testing what we
    # thought. Plus, the FATES wiki audit at e85d997 found
    # prescribed_puptake is declared but unused (FatesSoilBGCFluxMod.F90:202
    # uses prescribed_nuptake for both N and P scaling) — fixed in the
    # 2026-04-28 FATES rebuild but didn't apply to the original R4 run.
    parameters: 162
    ensembles: 200
    sampling_scheme: "subset_replay"
    config_file: "use_cases/Kougarok/config/kougarok_config_r4_subset_replay_PrescP.sh"
    paths:
      ensemble_name: "Kougarok_PlantTraitsCNPEnsemble162_PrescribedP"
      ensemble_output: "${A2MC_OUTPUT_ROOT}/Kougarok_PlantTraitsCNPEnsemble162_PrescribedP"
      extracted_data: "${A2MC_OUTPUT_ROOT}/Kougarok_PlantTraitsCNPEnsemble162_PrescribedP_Extract"
      param_dir: "<NERSC_HOME>/E3SM_Aid/FATES-ParameterFiles/fates_params_PrescribedP_EnPlantTraitsCNPparam162_R4"
      param_pattern: "fates_params_api25.5.0_12pft_c230710__PtCNP162_En{N}.nc"
      case_name_pattern: "Kougarok_ELM-FATES_PtCNPEn{N}PrescP_{PHASE}"
      case_scripts: "${A2MC_SCRIPTS_DIR}/Kougarok_FATES/ReCalibration_PtCNP162_AllPhase_PrescribedP"
    source_round: 3
    source_top_n: 200
    source_ranking_metric: "composite_rmsre"
    targets:
      - "PFT7_leaf, PFT7_fineroot"
      - "PFT9_leaf, PFT9_fineroot"
      - "PFT10_leaf, PFT10_fineroot"
    protocol:
      suplphos:
        ADSP: "ALL"
        RGSP: "ALL"
        TRANS: "NONE"
    overrides:
      fates_cnp_prescribed_puptake: 1.0
    changes_from_previous:
      - "Sampling: morris → subset_replay (top 200 R3 cases by composite_rmsre)"
      - "Override: fates_cnp_prescribed_puptake = 0 → 1.0 (P uptake prescribed at demand rate, removes P limitation)"
      - "Protocol kept identical to R3 (ADSP=ALL, RGSP=ALL, TRANS=NONE) to isolate the effect of the override — RGSP supplementation is technically redundant when prescribed_puptake=1.0 but kept for clean controlled-experiment attribution: any R4 vs R3 biomass difference can be solely attributed to the prescribed P uptake change"
      - "Source: R3 diagnosis (session 20260409_205811) recommended N-P limitation regime test (priority 3, confidence 0.80) — explicitly suggested running top R3 cases with prescribed P uptake to disentangle dominant nutrient limitation type"
    rationale: >
      Controlled experiment to disentangle N vs P limitation. The R3 diagnosis
      recommended an "N-P limitation regime diagnosis" — running top R3 cases
      with prescribed P uptake forces P availability to demand rate, effectively
      removing P as a constraint. If PFT10 biomass recovers substantially, P
      limitation is confirmed as the dominant bottleneck and future calibration
      should focus on soil P pool dynamics. If biomass barely changes, N or
      carbon is the binding constraint and parameter focus should shift to N
      uptake / allocation / turnover. Top 200 chosen to give
      enough statistical power to see the response distribution across the
      promising parameter landscape. Protocol kept identical to R3 because the
      top 200 cases were RANKED in the R3 protocol environment — changing the
      protocol would test those parameters under a different baseline than the
      one that selected them as promising.
    outcome: |
      Inconclusive due to compounding factors:
      (1) Bug 5 contamination — Phase 4 skip-testing loaded R3's 4890-row
          Morris Y matrix mislabeled as R4. All cited "across N cases"
          correlations were R3 statistics, not R4. Fixed in v2.85.
      (2) LABILEP depletion in R4 TRANS shown to be driven by the
          litter-trap mechanism (mortality pulse during 1963-68 drought
          + low w_scalar suppression of decomposition), not plant uptake.
          So prescribed P uptake didn't test what we thought.
      (3) FATES source quirk: `prescribed_puptake` is declared but
          unused in the daily P-gain calculation — `FatesSoilBGCFluxMod.F90:202`
          reads `prescribed_nuptake(pft)` for both N and P scaling
          magnitude (copy-paste typo from the parallel N-uptake block
          at lines 165-166). CORRECTED 2026-05-11: the original
          interpretation in this entry assumed `prescribed_nuptake`
          fell back to its source-code default (1.0). It does not.
          The A2MC ensemble generator (`phases/phase0_design/create_morris_ensemble.py:357`)
          explicitly sets `fates_cnp_prescribed_nuptake = 0` in every
          per-case parameter file, overriding the source default. So
          when old-R4 set `prescribed_puptake = 1.0`, the mode flipped
          to "prescribed P uptake" but the actual daily P gain was
          scaled by `prescribed_nuptake = 0` → effectively **P uptake
          forced to ZERO**, not "P at full demand". Old-R4 was therefore
          testing the *opposite* protocol from what was intended.
          Implication: "fully prescribed P uptake" has never actually
          been tested in any A2MC round. If a future round wants to
          test that, both `prescribed_puptake` AND `prescribed_nuptake`
          must be set to 1.0 in the parameter file (or in the override
          list), AND the 2026-04-28 FATES patch (which fixes
          `FatesSoilBGCFluxMod.F90:202` to use `prescribed_puptake(pft)`)
          must be applied. The patch is on the `fates-cnp-eca-tj`
          branch but is a no-op for R4 (new), R5, etc. unless they
          actually exercise prescribed-P mode.
      Cross-round comparison (tools/compare_rounds.py): PFT10 fineroot
      unchanged across 183/183 paired cases vs R3; Spearman ρ(R3 ranks,
      old-R4 ranks) = 0.05; top 5 R3 cases collapsed under prescribed P.
      Reading (CORRECTED 2026-05-11): the original reading was "P
      prescription alone does not rescue PFT10," based on the assumption
      that old-R4 had successfully prescribed P at full demand. Per
      finding (3) above, that assumption was wrong — old-R4 actually
      ran with effective P uptake = ZERO during TRANS (because the
      source quirk routes the magnitude through `prescribed_nuptake`,
      which the ensemble generator sets to 0). The "top 5 R3 cases
      collapsed under prescribed P" observation is therefore explained
      by P starvation, not by demonstration that P-prescription doesn't
      help. **What old-R4 actually tested was "R3 protocol + P uptake
      forced to zero in TRANS," not "R3 protocol + P at full demand."**
      Old-R4 thus carries no information about whether fully-prescribed
      P would rescue PFT10 — that hypothesis remains untested. The
      decision to redesign R4 (ADSPSupNP) is still defensible (P
      starvation is not a useful treatment to study), but the framing
      "P prescription alone does not rescue PFT10" should be retracted.
    status: superseded

  4:
    parameters: 162
    ensembles: 4890
    trajectories: 30
    sampling_scheme: "morris"
    config_file: "use_cases/Kougarok/config/kougarok_config_r4.sh"
    paths:
      ensemble_name: "Kougarok_PlantTraitsCNPEnsemble162_Morris_ADSPSupNP"
      ensemble_output: "${A2MC_OUTPUT_ROOT}/Kougarok_PlantTraitsCNPEnsemble162_Morris_ADSPSupNP"
      extracted_data: "${A2MC_OUTPUT_ROOT}/Kougarok_PlantTraitsCNPEnsemble162_Morris_ADSPSupNP_Extract"   # corrected 2026-06-06: dir name has Morris_ (was missing); verified on disk
      param_dir: "<NERSC_HOME>/E3SM_Aid/FATES-ParameterFiles/fates_params_NonPrescribed_EnPlantTraitsCNPparam162_Morris"
      param_pattern: "fates_params_api25.5.0_12pft_c230710__PtCNP162_En{N}.nc"
      case_name_pattern: "Kougarok_ELM-FATES_PtCNPEn{N}ADSPSupNP_{PHASE}"
      case_scripts: "${A2MC_SCRIPTS_DIR}/Kougarok_FATES/ReCalibration_PtCNP162_AllPhase_ADSPSupNP"
    targets:
      - "PFT7_leaf, PFT7_fineroot"
      - "PFT9_leaf, PFT9_fineroot"
      - "PFT10_leaf, PFT10_fineroot"
    protocol:
      suplphos:
        ADSP: "ALL"
        RGSP: "NONE"   # CHANGED from R3 (was ALL); matches R2 baseline
        TRANS: "NONE"
      suplnitro:
        ADSP: "ALL"    # CHANGED from R2/R3 (was NONE) — R4 primary hypothesis
        RGSP: "NONE"
        TRANS: "NONE"
    overrides: {}
    fates_source:
      branch: "fates-cnp-eca-tj"
      base_commit: "e85d997"
      patches:
        - id: "gradual-hydraulic-mortality"
          file: "biogeochem/EDMortalityFunctionsMod.F90"
          summary: |
            Replaces the binary hydraulic mortality switch at hf_sm_threshold
            with a linear ramp `(hf_sm_threshold - btran_ft)/hf_sm_threshold`,
            matching the flc-based path. Reduces catastrophic mortality during
            the 1963-68 Alaska drought event, mitigating the litter-trap
            mechanism that locks P in undecomposed litter.
        - id: "prescribed-puptake-fix"
          file: "biogeochem/FatesSoilBGCFluxMod.F90"
          line: 202
          summary: |
            prescribed_nuptake(pft) → prescribed_puptake(pft) in daily_p_gain
            calculation. Fixes the FATES source quirk discovered during the
            e85d997 wiki audit (memory/dev_logs/fates_wiki_audit_e85d997/06_parteh.md
            m6 and 10_advanced.md m5). Numerical no-op for R4 because R4
            doesn't use prescribed-P mode (overrides: {}), but unblocks
            decoupled N/P prescription rates for any future calibration
            that wants them.
    changes_from_previous:
      - "REDESIGN: subset_replay (200 cases, prescribed_puptake=1.0) → fresh Morris ensemble (4890 cases, no overrides)"
      - "Protocol vs old-R4: A2MC_ADSP_SUPLNITRO NONE → ALL; A2MC_RGSP_SUPLPHOS ALL → NONE"
      - "Closest analogue is R2 (Morris design, RGSP_SUPLPHOS=NONE): R4 differs from R2 by ADSP_SUPLNITRO=ALL"
      - "Removed override: fates_cnp_prescribed_puptake (was 1.0 in old-R4, now default 0)"
      - "FATES rebuild on fates-cnp-eca-tj: gradual hydraulic mortality + prescribed_puptake correctness fix"
      - "Parameter NC files: reuses R3's directory (R2/R3/new-R4 share parameter sets — only protocol differs)"
    rationale: >
      R3 iter07 diagnosis identified A2MC_ADSP_SUPLNITRO=NONE as the
      structural bottleneck preventing PFT10 (Arctic graminoid)
      establishment during AD spinup — under N co-limitation, PFT9
      out-competes PFT10 for the limiting N before PFT10 can build
      enough biomass to persist. Evidence: 0/4890 R3 coexistence cases;
      1,260 compound-favorable R3 cases (parameters nominally set to
      help PFT10) achieve mean PFT10 leaf biomass = 0.002 g C/m² ≈
      0.003% of target. R4 (subset_replay+prescribed_P) was an attempt
      to disentangle N vs P limitation but produced inconclusive
      results — the LABILEP-litter-trap mechanism dominated over plant
      uptake regardless of mode, and Bug 5 contaminated the
      skip-testing correlations.

      The redesigned R4 tests the N-limitation hypothesis cleanly via
      a fresh full Morris ensemble at the same 162 parameters as R2/R3
      with one protocol change: SUPLNITRO=ALL during ADSP. RGSP_SUPLPHOS
      is set back to NONE (matches R2; differs from R3) so the round is
      a single-variable test of ADSP N supplementation against the R2
      baseline. Concurrent FATES rebuild adds the gradual hydraulic
      mortality fix (reduces catastrophic 1963-68 drought mortality →
      smaller litter pulse → less P trapped → faster post-drought
      LABILEP recovery) and the prescribed_puptake correctness fix (no
      effect on R4 but corrects a long-standing source bug).

      Expected R4 outcome shape: if N-limitation hypothesis is correct,
      mean PFT10 leaf and fineroot biomass rise substantially across
      the Morris ensemble compared to R2; Spearman ρ(R2 ranks, R4 ranks)
      remains positive and moderately strong, indicating parameter
      effects survive the protocol change. If R4 shows no improvement,
      the N-limitation hypothesis is eliminated and structural / bound
      issues (mort_freezetol_10, l2fr_10 below 1, alloc_storage_cushion_10)
      become the focus of subsequent rounds.
    outcome: |
      R4 completed 4890/4890 paired cases on 2026-05-12. Headline (per
      memory/ana_logs/20260511a_R2_vs_R4_Attribution_Refresh_4884cases.md
      with 2026-05-12 addendum extending to 4890):

      (1) ADSP_SUPLNITRO=ALL DOES NOT RESCUE PFT10. PFT10 ADSP-end leaf
          delta (R4-R2) median = 0 with IQR [-0.128, +0.001] across all
          4890 paired cases. N supplementation reaches PFT7/9 (shrubs)
          but not PFT10 (graminoid). The R4 primary hypothesis is
          decisively falsified.

      (2) FINE-ROOT RE-ALLOCATION PATHOLOGY surfaced. R4's ADSP N
          supplementation REDUCES fine-root biomass for all 3 PFTs
          (median deltas: PFT7 −0.023, PFT9 −0.001, PFT10 −4e-5). Classic
          plant-physiology trade-off (N abundant → less foraging
          investment), but for PFT10 the trade nets NEGATIVE (no leaf
          gain to offset the fineroot cost). Once supplementation ends,
          plants have a diminished fineroot pool but the same need to
          forage for season-pulsed nutrients during TRANS. The R4
          protocol fights itself for the very PFT it was designed to
          help.

      (3) HYDRAULIC MORTALITY RAMP IS A WASH at aggregate. TRANS-
          integrated hydraulic mortality flux delta (R4-R2): PFT7 median
          slightly positive (+7e-10, R4 has MORE mortality), PFT9/PFT10
          medians near-null. The smoother ramp produces variance
          changes worth a follow-up but no aggregate magnitude reduction.

      (4) BEST-CASE NRMSE: case #302 with NRMSE = 0.5280 (vs R2's #1386
          at 0.5867). Improvement is real but small, and not cleanly
          attributable to either intervention.

      Implication: subsequent rounds should target the ALLOCATION
