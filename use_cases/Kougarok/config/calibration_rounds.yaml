# Calibration Round History for Kougarok Site
# =============================================================================
# This file documents the evolution of calibration rounds (outermost loop).
# Each round represents a full Phase 0-7 cycle with potentially different
# parameter spaces, bounds, simulation protocols, or validation targets.
#
# Rounds 1-2 were manually documented (pre-dating this feature).
# Subsequent rounds are auto-generated by A2MC at the end of Phase 6/7.
# =============================================================================

rounds:
  1:
    parameters: 138
    ensembles: 4170
    trajectories: 30
    targets:
      - "PFT7_leaf, PFT7_fineroot, PFT7_abg"
      - "PFT9_leaf, PFT9_fineroot, PFT9_abg"
      - "PFT10_leaf, PFT10_fineroot, PFT10_abg"
    protocol:
      suplphos:
        ADSP: "ALL"
        RGSP: "NONE"
        TRANS: "NONE"
    changes_from_previous: null
    rationale: >
      Initial exploration with 138 plant-trait and CNP parameters.
      Supplementary phosphorus prescribed only during AD spinup (ADSP).
      Validation against 9 targets: leaf, fineroot, and aboveground biomass
      for 3 Arctic PFTs.
    outcome: >
      Best case achieved 7/9 targets; PFT10 (arctic graminoid) fineroot
      biomass systematically under-predicted. Zero simulations achieved all
      3 PFTs within observational uncertainty simultaneously for fineroot.
      Parameter space gaps identified for nutrient uptake and allocation.
      PFT10 AGB observation (17.4 g C/m2) found inconsistent — smaller than
      PFT10 leaf biomass (82.7 g C/m2), physically impossible.
    status: completed

  2:
    parameters: 162
    ensembles: 4890
    trajectories: 30
    targets:
      - "PFT7_leaf, PFT7_fineroot"
      - "PFT9_leaf, PFT9_fineroot"
      - "PFT10_leaf, PFT10_fineroot"
    protocol:
      suplphos:
        ADSP: "ALL"
        RGSP: "NONE"
        TRANS: "NONE"
    changes_from_previous:
      - "Expanded parameter list from 138 to 162 (+24 nutrient uptake and allocation params)"
      - "Adjusted bounds for several parameters based on Round 1 edge-of-range analysis"
      - "Dropped ABG targets — PFT10 AGB observation inconsistent (smaller than leaf biomass)"
    rationale: >
      Address parameter space gaps identified in Round 1 diagnosis.
      Added ECA nutrient competition parameters, retranslocation fractions,
      and additional allocation parameters to give the optimizer more
      degrees of freedom for PFT10 fineroot calibration. Reduced to 6 targets
      (leaf + fineroot only) after discovering ABG data inconsistency.
    outcome: >
      AI diagnosis identified chronic P-limitation in RGSP as root cause
      of PFT10 underperformance. The suplphos_rgsp_for_p_limitation
      discovery recommended extending supplementary P through RGSP phase.
      Multiple experiment cycles confirmed parameter tuning alone cannot
      overcome insufficient soil P pools from spinup.
    status: completed

  3:
    parameters: 162
    ensembles: 4890
    trajectories: 30
    targets:
      - "PFT7_leaf, PFT7_fineroot"
      - "PFT9_leaf, PFT9_fineroot"
      - "PFT10_leaf, PFT10_fineroot"
    protocol:
      suplphos:
        ADSP: "ALL"
        RGSP: "ALL"
        TRANS: "NONE"
    changes_from_previous:
      - "Enabled supplementary P for RGSP (was 'NONE' in Rounds 1-2)"
    rationale: >
      AI diagnosis in Round 2 identified P-limitation in RGSP as root
      cause of PFT10 underperformance. Extending suplphos='ALL' through
      RGSP allows soil P pools to equilibrate before the transient run,
      preventing chronic P starvation. Same parameter space and targets
      as Round 2 to isolate the effect of the protocol change.
    outcome: null
    status: in_progress
