# Calibration Round History for Kougarok Site
# =============================================================================
# This file documents the evolution of calibration rounds (outermost loop).
# Each round represents a full Phase 0-7 cycle with potentially different
# parameter spaces, bounds, simulation protocols, or validation targets.
#
# Rounds 1-2 were manually documented (pre-dating this feature).
# Subsequent rounds are auto-generated by A2MC at the end of Phase 6/7.
#
# Path placeholders: machine-specific absolute paths were scrubbed for the public
# demo. Fill in for your environment:
#   <NERSC_CFS>          NERSC CFS project dir on Perlmutter
#   <NERSC_HOME>         NERSC home dir on Perlmutter
#   <NERSC_SCRATCH>      NERSC scratch dir on Perlmutter
#   <OFFLINE_WORKSPACE>  local offline analysis workspace
#   <OFFLINE_KB>         local offline knowledge-base dir
# (Real values for this project are kept in a private dev log, not synced.)
# =============================================================================

rounds:
  1:
    parameters: 138
    ensembles: 4170
    trajectories: 30
    sampling_scheme: "morris"
    # Offline iteration (pre-A2MC). Simulations ran on Perlmutter (NERSC
    # project m2467); ensemble assembly + evaluation were done locally on
    # Jing's Mac. The 4170 Morris cases were complemented by 159 parameter-
    # modification cases (phen2675 / phen2675stc3 / phen2675stc3pid + Case#845
    # exp1-5, exp4a-d), giving 4329 total (4320 in the combined-ranking
    # analysis). Paths below are transcribed from the Dec 2025 offline logs,
    # NOT re-verified on Perlmutter (see verification_note).
    total_cases: 4329   # 4170 original_morris + 159 modification cases
    config_file: null   # pre-A2MC; no kougarok_config_*.sh existed yet
    paths:
      perlmutter:
        nersc_project: "m2467"
        e3sm_root: "<NERSC_CFS>/E3SM_FATES"
        fates_branch: "fates-cnp-eca (later renamed elm-fates-cnp-eca; precursor to today's fates-cnp-eca-tj)"
        simulation_dir: "<NERSC_CFS>/Kougarok_PlantTraitsCNPEnsemble138_Morris_noADSP2"   # per-case runs at <simulation_dir>/{case_name}/run/; the phen2675stc3pid + Case#845 modification cases also live here (confirmed by Jing 2026-06-05)
        extracted_results: "<NERSC_CFS>/Kougarok_PlantTraitsCNPEnsemble138_Morris_noADSP2_Mat_TRANS"   # MATLAB-format TRANS biomass extraction of the 4170 Morris cases
        phenology_cnp_diag: "<NERSC_CFS>/Kougarok_PlantTraitsCNPEnsemble138_Morris_noADSP2_diag/extracted_phenology_data"   # uploaded per-case phenology + CNP-allocation diagnostics; set A2MC_PHENO_DATA_DIR to THIS path (the dir directly holding {case}_fates_phenology_daily_*.csv = the extracted_phenology_data subdir, NOT the _diag root). Uploaded 2026-06-06 from the Mac; chain verified working 2026-06-06.
        spinup_note: "noADSP2 = single AD spinup period (there is NO 2nd ADSP period); it does NOT mean 'no AD spinup'"
        case_scripts: "<NERSC_SCRATCH>/CaseScripts/Kougarok_FATES/PlantTraitsCNPEnsemble138_wModPval_Morris_ModPara/"
        case_name_pattern: "Kougarok_ELM-FATES_PtCNPEn{N}_TRANS"   # mods: _En{N}_mod_phen / _mod_phen_stc3 / _mod_phen_stc3_pid / _En845_exp*
        param_pattern: "fates_params_api25.5.0_12pft_c230710__PtCNP_En{N}.nc"
        base_param_file: "fates_params_api25.5.0_12pft_c230710.nc"
      local_analysis:   # on Jing's Mac, where ensemble assembly + scoring happened
        workspace: "<OFFLINE_WORKSPACE>/Program/OptimizationLeafRoot"
        extracted_results: "<OFFLINE_WORKSPACE>/Results_PlantTraitsCNPEnsemble_wModPval_noADSP2"   # holds extracted_monthly_data_* + sample TRANS .nc
        morris_x_matrix: "<OFFLINE_WORKSPACE>/SALib_FATES/FATES_CNPnPlantTraits_138param_Morris_4170sets.txt"
        param_files_dir: "<OFFLINE_WORKSPACE>/FATESparameterfiles/fates_params_NonPrescribed_EnPlantTraitsCNPparam138_Morris"
        validation_targets: "Program/OptimizationLeafRoot/validation_targets_leafroot.txt"
        comprehensive_evaluation: "OptimizationLeafRoot/results/comprehensive_evaluation_all_experiments_4329cases.txt"   # results/ subdir reorganized since Dec 2025; regenerable via evaluate_all_experiments_comprehensive.py
        combined_ranking: "OptimizationLeafRoot/results/combined_top50_morris_and_modifications.txt"
    provenance:
      offline_logs_dir: "<OFFLINE_KB>/memory/"
      curated_list: "<OFFLINE_WORKSPACE>/Program/A2MC/Offline/curated_list.txt"
      key_logs:
        - "20251220a_AssembleAllCurrentSimulations4329cases.md  (assembly, paths, NRMSE + +/-20% validation method)"
        - "20251211a_LeafRootOptimization_Workflow.md"
        - "20251214a_Case2678vs845_ParameterTradeoff.md"
        - "20251222a_PFT10_Diagnostic_Findings_Triple_Bottleneck.md"
    key_cases:
      best_combined: 2678        # best across all 6 leaf+fineroot targets
      pft10_fineroot_match: 845  # only Morris case matching PFT#10 fineroot
      phenology_base: 2675
      modification_base: 3643
    verification_note: >
      Paths captured from Dec 2025 offline logs, written from the Mac dev clone
      on 2026-06-05 and NOT re-verified on Perlmutter. CAUTION for the
      Perlmutter session: the pscratch case_scripts dir is almost certainly
      auto-purged by now (NERSC purges files inactive ~8 weeks), and the CFS
      run_output under project m2467 may have been cleaned or the m2467
      allocation retired. ls-check both before relying on them, and fall back
      to the local_analysis copies (verified present on the Mac 2026-06-05,
      except the results/ subdir which was reorganized and is regenerable).
    targets:
      - "PFT7_leaf, PFT7_fineroot, PFT7_abg"
      - "PFT9_leaf, PFT9_fineroot, PFT9_abg"
      - "PFT10_leaf, PFT10_fineroot, PFT10_abg"
    protocol:
      suplphos:
        ADSP: "ALL"
        RGSP: "NONE"
        TRANS: "NONE"
    changes_from_previous: null
    rationale: >
      Initial exploration with 138 plant-trait and CNP parameters.
      Supplementary phosphorus prescribed only during AD spinup (ADSP).
      Validation against 9 targets: leaf, fineroot, and aboveground biomass
      for 3 Arctic PFTs.
    outcome: >
      Best case achieved 7/9 targets; PFT10 (arctic graminoid) fineroot
      biomass systematically under-predicted. Zero simulations achieved all
      3 PFTs within observational uncertainty simultaneously for fineroot.
      Parameter space gaps identified for nutrient uptake and allocation.
      PFT10 AGB observation (17.4 g C/m2) found inconsistent — smaller than
      PFT10 leaf biomass (82.7 g C/m2), physically impossible.
    outcome_leafroot_basis: >
      Candidate differences: 138 vs 162 parameters, the
      159 hand-tuned modification cases layered on top of Morris, the noADSP2
      single-AD-spinup protocol, NERSC project m2467, and the earlier
      fates-cnp-eca build. See memory/ana_logs/20260605a for the full summary.
    status: completed

