" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Input: soil_forc%temp soil_forc%air_vol soil_forc%h2osoi_liqvol atm_forc%ra</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Henry-1" transform="translate(603, 295)"><rect class="basic label-container" style="" x="-130" y="-111" width="260" height="222"></rect><g class="label" style="" transform="translate(-100, -96)"><rect></rect><foreignObject width="200" height="192"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Henry's Law Constants henrycef_O2 = 1.3e-3 * exp(-1500 * ΔT) henrycef_N2O = 2.5e-2 * exp(-2600 * ΔT) henrycef_N2 = 6.1e-4 * exp(-1300 * ΔT) where ΔT = (1/T - 1/298.15)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Bunsen-2" transform="translate(448, 555)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"></rect><g class="label" style="" transform="translate(-100, -36)"><rect></rect><foreignObject width="200" height="72"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Bunsen Coefficients bunsencef = henrycef * T / 12.2</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-PhaseConv-3" transform="translate(138, 827)"><rect class="basic label-container" style="" x="-130" y="-123" width="260" height="246"></rect><g class="label" style="" transform="translate(-100, -108)"><rect></rect><foreignObject width="200" height="216"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Phase Conversion o2_w2b = air_vol/bunsen_O2 + h2osoi_liqvol o2_g2b = air_vol + h2osoi_liqvol * bunsen_O2 n2_g2b = air_vol + h2osoi_liqvol * bunsen_N2 n2o_g2b = air_vol + h2osoi_liqvol * bunsen_N2O</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Diffus-4" transform="translate(448, 827)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"></rect><g class="label" style="" transform="translate(-100, -72)"><rect></rect><foreignObject width="200" height="144"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Gas Diffusivities Dg_N2 = 1.93e-5 * (T/273)^1.82 * taugas Dg_O2 = 1.8e-5 * (T/273)^1.82 * taugas Dg_N2O = 0.159e-4 * (T/293.15)^1.5 * taugas</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-AqueousDiff-5" transform="translate(758, 827)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"></rect><g class="label" style="" transform="translate(-100, -72)"><rect></rect><foreignObject width="200" height="144"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Aqueous Diffusivities Dw_N2 = 2.57e-9 * (T/273) * tauaqu Dw_O2 = 2.4e-9 * (T/298) * tauaqu Dw_N2O = 2.6e-9 * (T/298.15) * tauaqu</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Conduct-6" transform="translate(448, 1051)"><rect class="basic label-container" style="" x="-170.0234375" y="-51" width="340.046875" height="102"></rect><g class="label" style="" transform="translate(-140.0234375, -36)"><rect></rect><foreignObject width="280.046875" height="72"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Aerenchyma Conductance aren_cond = 1 / [ra + 0.5<em>dzsoi / (Dg</em>air_vol + (Dw+Diff_Darcy)<em>h2osoi_liqvol</em>bunsen)]</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-SoluteDiff-7" transform="translate(758, 555)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"></rect><g class="label" style="" transform="translate(-100, -84)"><rect></rect><foreignObject width="200" height="168"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Solute Diffusivities diffusw_NH4 = 1.64e-9 * T/298.15 * tauaqu diffusw_NO3 = 2.6e-9 * T/298.15 * tauaqu diffusw_MINP = 0.7e-9 * T/293.15 * tauaqu</p></span></div></foreignObject></g></g></g></g></g></svg>