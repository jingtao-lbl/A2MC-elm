  FATES_L2FR_CANOPY_REC_PF:
    long_name: "Canopy recruit L2FR by PFT"
    units: "kg kg-1"
    dimension: "pft"
    category: "allocation"
    notes: "L2FR for new canopy recruits; reflects recent allocation"

  FATES_L2FR_USTORY_REC_PF:
