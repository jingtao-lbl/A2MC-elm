    category: "biomass"

  FATES_FROOTP_SZPF:
    long_name: "Fine root phosphorus by size-PFT"
    units: "kg P m-2"
    dimension: "szpf"
    category: "biomass"

  FATES_VEGC_SZPF:
    long_name: "Total vegetation carbon by size-PFT"
    units: "kg C m-2"
    dimension: "szpf"
    category: "biomass"

  FATES_VEGC_ABOVEGROUND_SZPF:
    long_name: "Aboveground biomass by size-PFT"
    units: "kg C m-2"
    dimension: "szpf"
    category: "biomass"

  FATES_NPP_SZPF:
    long_name: "Net primary production by size-PFT"
    units: "kg C m-2 s-1"
    dimension: "szpf"
    category: "carbon_flux"

  FATES_LEAF_ALLOC_SZPF:
    long_name: "Leaf allocation by size-PFT"
    units: "kg C m-2 s-1"
    dimension: "szpf"
    category: "allocation"

  FATES_FROOT_ALLOC_SZPF:
    long_name: "Fine root allocation by size-PFT"
    units: "kg C m-2 s-1"
    dimension: "szpf"
    category: "allocation"

  FATES_SEED_ALLOC_SZPF:
    long_name: "Seed allocation by size-PFT"
    units: "kg C m-2 s-1"
    dimension: "szpf"
    category: "allocation"

  # --- Nutrient Uptake (SZPF) ---
  FATES_PUPTAKE_SZPF:
    long_name: "Phosphorus uptake by size-PFT"
    units: "kg P m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"
    controlled_by:
      - ECA_Competition
      - Root_Distribution
    key_parameters:
      - fates_cnp_vmax_p
      - fates_cnp_km_p
      - fates_allom_fnrt_prof_a
      - fates_allom_fnrt_prof_b

  FATES_NH4UPTAKE_SZPF:
    long_name: "NH4 uptake by size-PFT"
    units: "kg N m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"
    controlled_by:
      - ECA_Competition
    key_parameters:
      - fates_cnp_vmax_nh4

  FATES_NO3UPTAKE_SZPF:
    long_name: "NO3 uptake by size-PFT"
    units: "kg N m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"
    controlled_by:
      - ECA_Competition
    key_parameters:
      - fates_cnp_vmax_no3

  FATES_PDEMAND_SZPF:
    long_name: "Phosphorus demand by size-PFT"
    units: "kg P m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"

  FATES_NDEMAND_SZPF:
    long_name: "Nitrogen demand by size-PFT"
    units: "kg N m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"

  FATES_PEFFLUX_SZPF:
    long_name: "Phosphorus efflux by size-PFT"
    units: "kg P m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"

  FATES_NEFFLUX_SZPF:
    long_name: "Nitrogen efflux by size-PFT"
    units: "kg N m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"

  FATES_NFIX_SYM_SZPF:
    long_name: "Symbiotic N fixation by size-PFT"
    units: "kg N m-2 s-1"
    dimension: "szpf"
    category: "nutrient_cycling"

  # --- Reproductive Pools (SZPF) ---
  FATES_REPROC_SZPF:
    long_name: "Reproductive carbon by size-PFT"
    units: "kg C m-2"
    dimension: "szpf"
    category: "reproduction"

  FATES_REPRON_SZPF:
    long_name: "Reproductive nitrogen by size-PFT"
    units: "kg N m-2"
    dimension: "szpf"
    category: "reproduction"

  FATES_REPROP_SZPF:
    long_name: "Reproductive phosphorus by size-PFT"
    units: "kg P m-2"
    dimension: "szpf"
    category: "reproduction"

  # =========================================================================
  # SOIL LAYER VARIABLES (2D: levdcmp = 15 layers)
  # =========================================================================

  LABILEP_vr:
    long_name: "Labile P by layer"
    units: "g P m-3"
    dimension: "levdcmp"
    category: "soil_nutrients"
    notes: "Plant-available inorganic P"

  SECONDP_vr:
    long_name: "Secondary mineral P by layer"
    units: "g P m-3"
    dimension: "levdcmp"
    category: "soil_nutrients"
    notes: "Aged, occluded P"

  SMINP_vr:
    long_name: "Soil mineral P by layer"
    units: "g P m-3"
    dimension: "levdcmp"
    category: "soil_nutrients"

  SMIN_NH4_vr:
    long_name: "Soil mineral NH4 by layer"
    units: "g N m-3"
    dimension: "levdcmp"
    category: "soil_nutrients"
    notes: "Plant-available ammonium"

  SMIN_NO3_vr:
    long_name: "Soil mineral NO3 by layer"
    units: "g N m-3"
    dimension: "levdcmp"
    category: "soil_nutrients"
    notes: "Plant-available nitrate"

  F_NIT_vr:
    long_name: "Nitrification flux by layer"
    units: "g N m-3 s-1"
    dimension: "levdcmp"
    category: "soil_nutrients"
    notes: "NH4 → NO3 transformation"

  F_DENIT_vr:
    long_name: "Denitrification flux by layer"
    units: "g N m-3 s-1"
    dimension: "levdcmp"
    category: "soil_nutrients"
    notes: "NO3 → N2/N2O loss"

  # =========================================================================
  # ELEMENT-LEVEL VARIABLES (2D: fates_levelem = 3: C, N, P)
  # =========================================================================

  FATES_SEED_BANK_EL:
    long_name: "Seed bank mass by element"
    units: "kg m-2"
    dimension: "levelem"
    category: "reproduction"
    notes: "Element index: 0=C, 1=N, 2=P"

  FATES_SEED_DECAY_EL:
    long_name: "Seed decay flux by element"
    units: "kg m-2 s-1"
    dimension: "levelem"
    category: "reproduction"
    key_parameters:
      - fates_seed_decay

  FATES_SEED_GERM_EL:
    long_name: "Seed germination by element"
    units: "kg m-2 s-1"
    dimension: "levelem"
    category: "reproduction"

  # =========================================================================
  # ROOT DISTRIBUTION (2D: levsoi = 10 layers)
  # =========================================================================

  FATES_FROOTC_SL:
    long_name: "Fine root carbon by soil layer"
    units: "kg C m-3"
    dimension: "levsoi"
    category: "biomass"
    controlled_by:
      - Root_Distribution
    key_parameters:
      - fates_allom_fnrt_prof_a
      - fates_allom_fnrt_prof_b
    notes: "Volumetric fine root C; affects ECA capacitance spatial overlap"

# -----------------------------------------------------------------------------
# Individual Parameter Relationships
# -----------------------------------------------------------------------------
parameters:
  # CNP Parameters
  fates_cnp_pid_kp:
    category: cnp
    controls:
      - PID_Controller
    affects:
      - FATES_L2FR
      - FATES_LEAFC
      - FATES_FROOTC
    related_to:
      - fates_cnp_pid_ki
      - fates_cnp_pid_kd
    calibration_notes: |
      Proportional gain for PID allocation controller.
      Higher values = more responsive to nutrient stress.
      CAUTION: Very high values can cause oscillations.
      Typical range: 1e-6 to 0.01

  fates_cnp_pid_ki:
    category: cnp
    controls:
      - PID_Controller
    affects:
      - FATES_L2FR
    related_to:
      - fates_cnp_pid_kp
      - fates_cnp_pid_kd
    calibration_notes: |
      Integral gain for PID controller (allocation memory).
      Helps reduce steady-state error.
      Typical range: 0 to 0.001

  fates_cnp_pid_kd:
    category: cnp
    controls:
      - PID_Controller
    affects:
      - FATES_L2FR
    related_to:
      - fates_cnp_pid_kp
      - fates_cnp_pid_ki
    calibration_notes: |
      Derivative gain for PID controller.
      Dampens rapid changes in allocation.
      Typical range: 0.01 to 0.5

  fates_cnp_vmax_p:
    category: cnp
    controls:
      - ECA_Competition
    affects:
      - FATES_PUPTAKE_SZPF
      - FATES_FROOTC
      - FATES_LEAFC
    related_to:
      - fates_cnp_km_p
      - fates_cnp_vmax_ptase
    calibration_notes: |
      Maximum P uptake rate per unit fine root.
      CAUTION: Higher values don't always increase total uptake
      due to PID feedback (Allocation Paradox).
      Typical range: 1e-9 to 5e-5

  fates_cnp_vmax_ptase:
    category: cnp
    controls:
      - ECA_Competition
    affects:
      - FATES_PUPTAKE_SZPF
    related_to:
      - fates_cnp_vmax_p
    calibration_notes: |
      Maximum phosphatase production rate.
      Affects organic P mineralization.
      Typical range: 1e-9 to 5e-4

  # Allocation Parameters
  fates_alloc_storage_cushion:
    category: allocation
    controls:
      - Storage_Allocation
    affects:
      - FATES_STOREC
      - FATES_NPP
      - FATES_LEAFC
      - FATES_FROOTC
    related_to:
      - fates_alloc_store_priority_frac
    calibration_notes: |
      Target storage relative to leaf biomass.
      Higher values = more C reserved for storage.
      Arctic plants may need 2-3 for winter survival.
      Typical range: 0.5 to 5.0

  fates_alloc_store_priority_frac:
    category: allocation
    controls:
      - Storage_Allocation
    affects:
      - FATES_STOREC
    related_to:
      - fates_alloc_storage_cushion
    calibration_notes: |
      Fraction of storage demand met before growth.
      Higher values = storage prioritized over growth.
      Typical range: 0.5 to 1.0

  fates_allom_l2fr:
    category: allometry
    controls:
      - Target_Ratios
    affects:
      - FATES_L2FR
      - FATES_FROOTC
    related_to:
      - fates_cnp_pid_kp
    calibration_notes: |
      Target leaf-to-fine-root ratio.
      PID controller adjusts actual ratio toward this target.
      Typical range: 0.5 to 3.0

  # Root Distribution Parameters
  fates_allom_fnrt_prof_a:
    category: allometry
    controls:
      - Root_Distribution
    affects:
      - FATES_PUPTAKE_SZPF
      - FATES_NUPTAKE_SZPF
    related_to:
      - fates_allom_fnrt_prof_b
    calibration_notes: |
      Root distribution shape parameter a.
      Higher a = steeper surface decline.
      Should be calibrated from field data.
      Typical range: 5 to 25

  fates_allom_fnrt_prof_b:
    category: allometry
    controls:
      - Root_Distribution
    affects:
      - FATES_PUPTAKE_SZPF
      - FATES_NUPTAKE_SZPF
    related_to:
      - fates_allom_fnrt_prof_a
    calibration_notes: |
      Root distribution shape parameter b.
      Higher b = more surface-concentrated.
      Should be calibrated from field data.
      Typical range: 1 to 20

  # Turnover Parameters
  fates_turnover_fnrt:
    category: turnover
    controls:
      - Root_Turnover
    affects:
      - FATES_FROOTC
    related_to:
      - fates_turnover_leaf
    calibration_notes: |
      Fine root turnover time (years).
      Higher values = longer-lived roots = more biomass.
      Arctic roots may live 3-5+ years.
      Typical range: 0.5 to 5.0

  fates_turnover_leaf:
    category: turnover
    controls:
      - Leaf_Turnover
    affects:
      - FATES_LEAFC
    related_to:
      - fates_turnover_fnrt
    calibration_notes: |
      Leaf turnover time (years).
      Note: In latest FATES, split into canopy/understory.
      Typical range: 0.5 to 3.0

  # Phenology Parameters
  fates_phen_gddthresh_a:
    category: phenology
    controls:
      - Cold_Deciduous
    affects:
      - FATES_DAYSINCE_COLDLEAFON
    related_to:
      - fates_phen_gddthresh_b
      - fates_phen_gddthresh_c
    calibration_notes: |
      GDD threshold offset in formula: a + b*lat + c*chill.
      Shared parameter (not PFT-specific).

  fates_phen_gddthresh_c:
    category: phenology
    controls:
      - Cold_Deciduous
    affects:
      - FATES_DAYSINCE_COLDLEAFON
    related_to:
      - fates_phen_gddthresh_a
      - fates_phen_chilltemp
    calibration_notes: |
      GDD threshold slope vs chilling days.
      Negative values = lower threshold with more chilling.
      Shared parameter (not PFT-specific).

  fates_phen_chilltemp:
    category: phenology
    controls:
      - Cold_Deciduous
    affects:
      - FATES_DAYSINCE_COLDLEAFON
    related_to:
      - fates_phen_gddthresh_c
    calibration_notes: |
      Temperature threshold for chilling accumulation (°C).
      Days below this temp count as chilling days.
      Shared parameter (not PFT-specific).
      Typical range: 0 to 10°C

  # Mortality Parameters
  fates_mort_scalar_cstarvation:
    category: mortality
    controls:
      - Carbon_Starvation
    affects:
      - FATES_MORTALITY_CSTARV_SZPF
    related_to:
      - fates_mort_upthresh_cstarvation
    calibration_notes: |
      Scalar for carbon starvation mortality rate.
      Lower values = less sensitive to low storage.
      Typical range: 0.15 to 1.0

  # Storage and Stability Parameters (Knox 2026 recommendations)
  fates_cnp_nitr_store_ratio:
    category: cnp
    controls:
      - Storage_Allocation
    affects:
      - FATES_STOREN
    related_to:
      - fates_cnp_phos_store_ratio
      - fates_alloc_storage_cushion
    calibration_notes: |
      Target N storage relative to structural N.
      Higher values = more N stored = more stability.
      Promotes plant survivability and adaptability.

  fates_cnp_phos_store_ratio:
    category: cnp
    controls:
      - Storage_Allocation
    affects:
      - FATES_STOREP
    related_to:
      - fates_cnp_nitr_store_ratio
      - fates_alloc_storage_cushion
    calibration_notes: |
      Target P storage relative to structural P.
      Higher values = more P stored = more stability.
      Promotes plant survivability and adaptability.

  fates_cnp_store_ovrflw_frac:
    category: cnp
    controls:
      - Storage_Allocation
    affects:
      - FATES_STOREC
      - FATES_NEFFLUX
      - FATES_PEFFLUX
    calibration_notes: |
      Fraction of excess nutrients to overflow storage.
      Higher values = more overflow to storage = more stability.

  # Retranslocation Parameters
  fates_cnp_turnover_nitr_retrans:
    category: cnp
    controls:
      - Nutrient_Uptake
    affects:
      - FATES_STOREN
    related_to:
      - fates_cnp_turnover_phos_retrans
    calibration_notes: |
      N reabsorption fraction from senescing tissues.
      Higher values = more N recycled = less N demand.
      Use to reduce N limitation if system struggles.
      Typical range: 0.3 to 0.7

  fates_cnp_turnover_phos_retrans:
    category: cnp
    controls:
      - Nutrient_Uptake
    affects:
      - FATES_STOREP
    related_to:
      - fates_cnp_turnover_nitr_retrans
    calibration_notes: |
      P reabsorption fraction from senescing tissues.
      Higher values = more P recycled = less P demand.
      Use to reduce P limitation if system struggles.
      Typical range: 0.3 to 0.7

  # N Fixation Parameter
  fates_cnp_nfix:
    category: cnp
    controls:
      - Nutrient_Uptake
    affects:
      - FATES_NFIX_SYM
    calibration_notes: |
      Symbiotic N fixation fraction (0-1).
      Set > 0 to make a PFT an N-fixer.
      Start with 0.1 (10%) if system needs more N.
      Common for legumes and some shrubs.

  # KM Parameters
  fates_cnp_km_nh4:
    category: cnp
    controls:
      - ECA_Competition
    affects:
      - FATES_NH4UPTAKE_SZPF
    related_to:
      - fates_cnp_vmax_nh4
      - fates_cnp_km_no3
    calibration_notes: |
      Half-saturation constant for NH4 uptake.
      Good starting point: same as decomposer KM.
      Larger values = less competitive with decomposers.
      Typical range: 0.1 to 10 gN/m³

  fates_cnp_km_no3:
    category: cnp
    controls:
      - ECA_Competition
    affects:
      - FATES_NO3UPTAKE_SZPF
    related_to:
      - fates_cnp_vmax_no3
      - fates_cnp_km_nh4
    calibration_notes: |
      Half-saturation constant for NO3 uptake.
      Good starting point: same as decomposer KM.
      Larger values = less competitive with decomposers.
      Typical range: 0.1 to 10 gN/m³

  fates_cnp_km_p:
    category: cnp
    controls:
      - ECA_Competition
    affects:
      - FATES_PUPTAKE_SZPF
    related_to:
      - fates_cnp_vmax_p
    calibration_notes: |
      Half-saturation constant for P uptake.
      Good starting point: same as decomposer KM.
      Larger values = prioritize decomposer uptake.
      Typical range: 0.01 to 1 gP/m³
