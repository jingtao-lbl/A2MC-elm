# =============================================================================
# FATES Curated Parameter Relationships
# =============================================================================
#
# This file contains manually curated relationships between FATES parameters,
# mechanisms, and output variables (from extract_monthly_variables_FATES.py). 
# It complements the auto-extracted parameter
# metadata from parameter files.
#
# Structure:
#   - categories: Parameter groupings with mechanisms they control
#   - mechanisms: Key FATES processes with parameter links
#   - outputs: Output variables affected by parameters
#   - parameters: Individual parameter relationships
#
# Relationship types:
#   - controls: Parameter directly controls a mechanism
#   - affects: Parameter affects output variables (directly or indirectly)
#   - related_to: Parameters often tuned together
#   - modifies: Parameter modifies another parameter's effect
#
# Version: 1.0
# Last updated: January 2026
# =============================================================================

# -----------------------------------------------------------------------------
# Parameter Categories
# -----------------------------------------------------------------------------
categories:
  cnp:
    full_name: "Carbon-Nitrogen-Phosphorus"
    description: "CNP cycling and nutrient uptake parameters"
    mechanisms:
      - PID_Controller
      - Nutrient_Uptake
      - ECA_Competition
      - Stoichiometry
    key_outputs:
      - FATES_LEAFC
      - FATES_FROOTC
      - FATES_STOREC
      - FATES_PUPTAKE_SZPF
      - FATES_NUPTAKE_SZPF

  allocation:
    full_name: "Carbon Allocation"
    description: "Allocation of carbon to plant organs"
    mechanisms:
      - Storage_Allocation
      - Organ_Priority
      - Target_Ratios
    key_outputs:
      - FATES_L2FR
      - FATES_STOREC
      - FATES_LEAFC
      - FATES_FROOTC

  allometry:
    full_name: "Allometry"
    description: "Size-biomass relationships"
    mechanisms:
      - DBH_Height
      - DBH_Biomass
      - Crown_Allometry
      - Root_Distribution
    key_outputs:
      - FATES_CANOPY_AREA
      - FATES_LAI
      - FATES_BIOMASS

  phenology:
    full_name: "Phenology"
    description: "Seasonal timing of leaf display"
    mechanisms:
      - Cold_Deciduous
      - Drought_Deciduous
      - Evergreen
    key_outputs:
      - FATES_DAYSINCE_COLDLEAFON
      - FATES_DAYSINCE_COLDLEAFOFF
      - FATES_LEAFC

  turnover:
    full_name: "Turnover"
    description: "Tissue turnover and longevity"
    mechanisms:
      - Leaf_Turnover
      - Root_Turnover
      - Background_Mortality
    key_outputs:
      - FATES_LEAFC
      - FATES_FROOTC
      - FATES_MORTALITY

  mortality:
    full_name: "Mortality"
    description: "Plant mortality processes"
    mechanisms:
      - Carbon_Starvation
      - Hydraulic_Failure
      - Background_Mortality
      - Fire_Mortality
    key_outputs:
      - FATES_MORTALITY_CSTARV_SZPF
      - FATES_MORTALITY_HYDRAULIC_SZPF
      - FATES_NPLANT

# -----------------------------------------------------------------------------
# Mechanisms (Key FATES Processes)
# -----------------------------------------------------------------------------
mechanisms:
  PID_Controller:
    description: "Proportional-Integral-Derivative controller for C:N:P allocation"
    code_reference: "FATESPartehMod.F90::CNPAllocate"
    doc_reference: "Knox et al. 2024 CNP Guidebook"
    parameters:
      - fates_cnp_pid_kp  # Proportional gain
      - fates_cnp_pid_ki  # Integral gain
      - fates_cnp_pid_kd  # Derivative gain
    affects:
      - FATES_L2FR
      - FATES_LEAFC
      - FATES_FROOTC
    notes: |
      The PID controller adjusts leaf-to-fine-root ratio based on
      C:nutrient stoichiometry in storage pool. Higher Kp = more responsive.

      CAUTION: Responsive allocation can be maladaptive under severe stress.

      KNOX 2024 RECOMMENDATION: If FATES_L2FR shows strange behavior
      (rapid monotonic changes, values < 0.1 or > 10), reduce fates_cnp_pid_kp
      by 10× to stabilize allocation during calibration.

  ECA_Competition:
    description: "Equilibrium Chemistry Approximation for nutrient uptake"
    code_reference: "FatesSoilBGCFluxMod.F90::nutrient_uptake"
    doc_reference: "Knox et al. 2024 Section 11"
    parameters:
      - fates_cnp_vmax_p   # Max P uptake rate
      - fates_cnp_vmax_nh4 # Max NH4 uptake rate
      - fates_cnp_vmax_no3 # Max NO3 uptake rate
      - fates_cnp_km_p     # Half-saturation for P
      - fates_cnp_km_nh4   # Half-saturation for NH4
      - fates_cnp_km_no3   # Half-saturation for NO3
    affects:
      - FATES_PUPTAKE_SZPF
      - FATES_NUPTAKE_SZPF
    notes: |
      ECA is simultaneous competition based on capacitance:
        Capacitance = root_biomass × vmax × root_distribution
      NOT sequential (one PFT doesn't "claim first").

      IMPORTANT: ECA vs RD vmax differences (Knox 2026):
        - ECA mode: vmax ~10^-7 (stronger source limitation needs larger vmax)
        - RD mode: vmax ~10^-9 (weaker limitation needs smaller vmax)

      KM guidance: Start with plant KM = decomposer KM. Consider making
      plant KM larger to prioritize decomposer uptake → more mineralization.

  RD_Competition:
    description: "Relative Demand approach for nutrient uptake"
    code_reference: "FatesSoilBGCFluxMod.F90::nutrient_uptake"
    parameters:
      - fates_cnp_vmax_nh4
      - fates_cnp_vmax_no3
      - fates_cnp_vmax_p
    affects:
      - FATES_PUPTAKE_SZPF
      - FATES_NUPTAKE_SZPF
    notes: |
      IMPORTANT: In RD mode, vmax_nh4 and vmax_no3 are ADDED together
      to compute total N demand. Individual values don't matter, only sum.

      With ECA, each vmax works independently on NH4 and NO3 uptake.

  Storage_Allocation:
    description: "Carbon allocation to storage pool"
    code_reference: "FATESPartehMod.F90::CNPAllocate"
    parameters:
      - fates_alloc_storage_cushion
      - fates_alloc_store_priority_frac
    affects:
      - FATES_STOREC
      - FATES_NPP
    notes: |
      Storage cushion = target storage relative to leaf biomass.
      Arctic plants may need higher values (2-3) for winter survival.

  Root_Distribution:
    description: "Vertical distribution of fine roots in soil"
    code_reference: "FatesAllometryMod.F90::exponential_2p_root_profile"
    parameters:
      - fates_allom_fnrt_prof_a  # Shape parameter a
      - fates_allom_fnrt_prof_b  # Shape parameter b
    affects:
      - FATES_PUPTAKE_SZPF  # Via spatial overlap with soil nutrients
      - FATES_NUPTAKE_SZPF
    notes: |
      Higher a,b = more surface-concentrated roots.
      Root distribution affects ECA capacitance for nutrient competition.
      IMPORTANT: These control ALL belowground distributions (not just fine roots).

  Cold_Deciduous:
    description: "Cold-deciduous phenology trigger"
    code_reference: "EDPhysiologyMod.F90::cold_deciduous_phenology"
    parameters:
      - fates_phen_gddthresh_a  # GDD threshold offset
      - fates_phen_gddthresh_b  # GDD threshold slope (latitude)
      - fates_phen_gddthresh_c  # GDD threshold slope (chilling)
      - fates_phen_chilltemp    # Chilling temperature threshold
      - fates_phen_coldtemp     # Cold temperature threshold
    affects:
      - FATES_DAYSINCE_COLDLEAFON
      - FATES_DAYSINCE_COLDLEAFOFF
    notes: |
      GDD threshold formula: GDD_thresh = a + b*lat + c*chilling_days

  Carbon_Starvation:
    description: "Mortality from depleted carbon storage"
    code_reference: "EDPhysiologyMod.F90::carbon_starvation_mortality"
    parameters:
      - fates_mort_scalar_cstarvation
      - fates_mort_upthresh_cstarvation
    affects:
      - FATES_MORTALITY_CSTARV_SZPF
    notes: |
      Triggered when storage C falls below threshold.
      Lower scalar = less sensitive to starvation.

# -----------------------------------------------------------------------------
# Output Variables (from extract_monthly_variables_FATES.py)
# -----------------------------------------------------------------------------
# Dimension levels:
#   - site: 1D (time, lndgrid) - gridcell aggregated
#   - pft: 2D (time, fates_levpft, lndgrid) - by PFT
#   - szpf: 2D (time, fates_levscpf, lndgrid) - by size-class × PFT
#   - levgrnd: 2D (time, levgrnd=15, lndgrid) - by soil layer
#   - levdcmp: 2D (time, levdcmp=15, lndgrid) - by decomposition layer
#   - levsoi: 2D (time, levsoi=10, lndgrid) - by FATES soil layer
#   - levelem: 2D (time, fates_levelem=3, lndgrid) - by element (C, N, P)
# -----------------------------------------------------------------------------

outputs:
  # =========================================================================
  # SITE-LEVEL VARIABLES (1D)
  # =========================================================================

  # --- Phenology ---
  FATES_TVEG24:
    long_name: "24-hour mean vegetation temperature"
    units: "K"
    dimension: "site"
    category: "phenology"

  FATES_GDD:
    long_name: "Growing degree days"
    units: "degree-day"
    dimension: "site"
    category: "phenology"
    controlled_by:
      - Cold_Deciduous

  FATES_COLD_STATUS:
    long_name: "Cold status indicator"
    units: "unitless"
    dimension: "site"
    category: "phenology"

  FATES_NCHILLDAYS:
    long_name: "Number of chill days"
    units: "days"
    dimension: "site"
    category: "phenology"
    controlled_by:
      - Cold_Deciduous
    key_parameters:
      - fates_phen_chilltemp

  FATES_NCOLDDAYS:
    long_name: "Number of cold days"
    units: "days"
    dimension: "site"
    category: "phenology"
    key_parameters:
      - fates_phen_coldtemp

  FATES_DAYSINCE_COLDLEAFON:
    long_name: "Days since cold leaf flush"
    units: "days"
    dimension: "site"
    category: "phenology"
    controlled_by:
      - Cold_Deciduous
    key_parameters:
      - fates_phen_gddthresh_a
      - fates_phen_gddthresh_b
      - fates_phen_gddthresh_c
      - fates_phen_chilltemp

  FATES_DAYSINCE_COLDLEAFOFF:
    long_name: "Days since cold leaf drop"
    units: "days"
    dimension: "site"
    category: "phenology"
    controlled_by:
      - Cold_Deciduous
    key_parameters:
      - fates_phen_coldtemp

  # --- Biomass Pools ---
  FATES_LAI:
    long_name: "Leaf area index"
    units: "m2 m-2"
    dimension: "site"
    category: "biomass"
    controlled_by:
      - allocation
      - allometry
    key_parameters:
      - fates_leaf_slatop
      - fates_alloc_storage_cushion

  FATES_VEGC:
    long_name: "Total vegetation carbon"
    units: "kg C m-2"
    dimension: "site"
    category: "biomass"

  FATES_VEGN:
    long_name: "Total vegetation nitrogen"
    units: "kg N m-2"
    dimension: "site"
    category: "biomass"

  FATES_VEGP:
    long_name: "Total vegetation phosphorus"
    units: "kg P m-2"
    dimension: "site"
    category: "biomass"

  FATES_LEAFC:
    long_name: "Leaf carbon"
    units: "kg C m-2"
    dimension: "site"
    category: "biomass"
    controlled_by:
      - allocation
      - phenology
      - turnover
    key_parameters:
      - fates_alloc_storage_cushion
      - fates_cnp_pid_kp
      - fates_turnover_leaf

  FATES_FROOTC:
    long_name: "Fine root carbon"
    units: "kg C m-2"
    dimension: "site"
    category: "biomass"
    controlled_by:
      - allocation
      - turnover
      - cnp
    key_parameters:
      - fates_alloc_storage_cushion
      - fates_cnp_pid_kp
      - fates_turnover_fnrt
      - fates_allom_l2fr

  FATES_STOREC:
    long_name: "Storage carbon"
    units: "kg C m-2"
    dimension: "site"
    category: "biomass"
    controlled_by:
      - Storage_Allocation
    key_parameters:
      - fates_alloc_storage_cushion
      - fates_alloc_store_priority_frac

  FATES_STOREN:
    long_name: "Storage nitrogen"
    units: "kg N m-2"
    dimension: "site"
    category: "biomass"

  FATES_STOREP:
    long_name: "Storage phosphorus"
    units: "kg P m-2"
    dimension: "site"
    category: "biomass"

  FATES_SAPWOODC:
    long_name: "Sapwood carbon"
    units: "kg C m-2"
    dimension: "site"
    category: "biomass"

  FATES_NFIX_SYM:
    long_name: "Symbiotic N fixation"
    units: "kg N m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"

  # --- Carbon Fluxes ---
  FATES_GPP:
    long_name: "Gross primary production"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"
    controlled_by:
      - photosynthesis
      - phenology

  FATES_NPP:
    long_name: "Net primary production"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"
    controlled_by:
      - photosynthesis
      - respiration

  FATES_AUTORESP:
    long_name: "Autotrophic respiration"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"

  FATES_MAINT_RESP:
    long_name: "Maintenance respiration"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"

  FATES_GROWTH_RESP:
    long_name: "Growth respiration"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"

  # --- Allocation Fluxes ---
  FATES_LEAF_ALLOC:
    long_name: "Allocation to leaves"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "allocation"
    controlled_by:
      - PID_Controller
      - Storage_Allocation

  FATES_FROOT_ALLOC:
    long_name: "Allocation to fine-roots"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "allocation"
    controlled_by:
      - PID_Controller
      - Storage_Allocation

  FATES_STORE_ALLOC:
    long_name: "Allocation to storage"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "allocation"
    controlled_by:
      - Storage_Allocation
    key_parameters:
      - fates_alloc_storage_cushion

  FATES_SEED_ALLOC:
    long_name: "Allocation to seeds"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "allocation"

  FATES_STEM_ALLOC:
    long_name: "Allocation to stem"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "allocation"

  FATES_CROOT_ALLOC:
    long_name: "Allocation to coarse roots"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "allocation"

  # --- Dynamic Allocation State ---
  FATES_L2FR:
    long_name: "Leaf to fine root ratio"
    units: "kg kg-1"
    dimension: "site"
    category: "allocation"
    controlled_by:
      - PID_Controller
    key_parameters:
      - fates_cnp_pid_kp
      - fates_cnp_pid_ki
      - fates_cnp_pid_kd
      - fates_allom_l2fr
    notes: |
      CRITICAL DIAGNOSTIC during spinup/calibration (Knox 2026):
      - Values < 0.1 or > 10: Very suspicious, indicates poor calibration
      - Rapid monotonic changes: PID over-reacting or N/P issues
      - Should reach equilibrium differentiated for canopy/understory
      If unstable: Reduce fates_cnp_pid_kp by 10×

  FATES_NEP:
    long_name: "Net ecosystem production"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"
    notes: |
      KEY SPINUP TARGET: Should approach ~0 when averaged over decades
      with stationary climate. Use to determine when equilibrium reached.

  FATES_NEFFLUX:
    long_name: "Nitrogen efflux (dumped excess N)"
    units: "kg N m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"
    notes: |
      N "dumped" because plant stores are saturated.
      CALIBRATION USE: If high + low NPP → vmax too high.
      Target: Very small NEFFLUX with reasonable biomass.
      Ratio NEFFLUX/NUPTAKE should be small after shock period.

  FATES_NDEMAND:
    long_name: "Nitrogen demand"
    units: "kg N m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"

  FATES_PDEMAND:
    long_name: "Phosphorus demand"
    units: "kg P m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"

  FATES_VEGC_ABOVEGROUND:
    long_name: "Aboveground vegetation carbon"
    units: "kg C m-2"
    dimension: "site"
    category: "biomass"
    notes: "Use for biomass validation against field measurements."

  FATES_HET_RESP:
    long_name: "Heterotrophic respiration"
    units: "kg C m-2 s-1"
    dimension: "site"
    category: "carbon_flux"
    notes: "Monitor to ensure decomposition cycle active."

  # Soil diagnostic ratios (compute from these)
  TOTSOMC:
    long_name: "Total soil organic matter carbon"
    units: "g C m-2"
    dimension: "site"
    category: "soil_carbon"
    notes: "Use TOTSOMC/TOTSOMN and TOTSOMC/TOTSOMP to monitor SOM quality."

  TOTSOMN:
    long_name: "Total soil organic matter nitrogen"
    units: "g N m-2"
    dimension: "site"
    category: "soil_nutrients"

  TOTSOMP:
    long_name: "Total soil organic matter phosphorus"
    units: "g P m-2"
    dimension: "site"
    category: "soil_nutrients"

  TOTLITC:
    long_name: "Total litter carbon"
    units: "g C m-2"
    dimension: "site"
    category: "litter"
    notes: "Use TOTLITC/TOTLITN and TOTLITC/TOTLITP to monitor litter quality."

  TOTLITN:
    long_name: "Total litter nitrogen"
    units: "g N m-2"
    dimension: "site"
    category: "litter"

  TOTLITP:
    long_name: "Total litter phosphorus"
    units: "g P m-2"
    dimension: "site"
    category: "litter"

  NFIX_TO_SMINN:
    long_name: "N fixation flux to soil mineral N"
    units: "g N m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"
    notes: "Free-living N fixation. See test_mult in ELM to increase if needed."

  SMINP_LEACHED:
    long_name: "Soil mineral P leached"
    units: "g P m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"
    notes: "Reduce leaching if system struggles to generate nutrients."

  SMIN_NO3_LEACHED:
    long_name: "Soil NO3 leached"
    units: "g N m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"
    notes: "Target to reduce if system struggles to generate N."

  # --- Demographics ---
  FATES_NPLANT:
    long_name: "Number of plants per m2"
    units: "plants m-2"
    dimension: "site"
    category: "demographics"
    controlled_by:
      - mortality
      - recruitment

  # --- Nutrient Fluxes ---
  FATES_PUPTAKE:
    long_name: "Phosphorus uptake (site total)"
    units: "kg P m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"
    controlled_by:
      - ECA_Competition

  FATES_PEFFLUX:
    long_name: "Phosphorus efflux"
    units: "kg P m-2 s-1"
    dimension: "site"
    category: "nutrient_cycling"

  # --- Climate (ELM) ---
  TSA:
    long_name: "2m air temperature"
    units: "K"
    dimension: "site"
    category: "climate"

  TSOI_10CM:
    long_name: "Soil temperature in top 10cm"
    units: "K"
    dimension: "site"
    category: "climate"

  SOILWATER_10CM:
    long_name: "Soil liquid water + ice in top 10cm"
    units: "kg m-2"
    dimension: "site"
    category: "climate"

  H2OSNO:
    long_name: "Snow water equivalent"
    units: "mm"
    dimension: "site"
    category: "climate"

  SNOW_DEPTH:
    long_name: "Snow depth"
    units: "m"
    dimension: "site"
    category: "climate"

  # --- Soil P Pools (ELM-BGC) ---
  LABILEP:
    long_name: "Labile P (plant-available)"
    units: "g P m-2"
    dimension: "site"
    category: "soil_nutrients"
    notes: "Only ~0.002% of total soil P; controls P availability"

  SECONDP:
    long_name: "Secondary mineral P (aged, occluded)"
    units: "g P m-2"
    dimension: "site"
    category: "soil_nutrients"
    notes: "~98.9% of soil P locked here; controlled by r_desorp/r_adsorp"

  SMINP:
    long_name: "Soil mineral P (total inorganic)"
    units: "g P m-2"
    dimension: "site"
    category: "soil_nutrients"

  # =========================================================================
  # PFT-LEVEL VARIABLES (2D: fates_levpft)
  # =========================================================================

  FATES_LEAFC_PF:
    long_name: "Leaf carbon by PFT"
    units: "kg C m-2"
    dimension: "pft"
    category: "biomass"
    controlled_by:
      - allocation
      - phenology
      - turnover

  FATES_FROOTC_PF:
    long_name: "Fine root carbon by PFT"
    units: "kg C m-2"
    dimension: "pft"
    category: "biomass"
    controlled_by:
      - allocation
      - turnover

  FATES_STOREC_PF:
    long_name: "Storage carbon by PFT"
    units: "kg C m-2"
    dimension: "pft"
    category: "biomass"

  FATES_GPP_PF:
    long_name: "GPP by PFT"
    units: "kg C m-2 s-1"
    dimension: "pft"
    category: "carbon_flux"

  FATES_NPP_PF:
    long_name: "NPP by PFT"
    units: "kg C m-2 s-1"
    dimension: "pft"
    category: "carbon_flux"

  FATES_MORTALITY_CFLUX_PF:
    long_name: "Mortality carbon flux by PFT"
    units: "kg C m-2 s-1"
    dimension: "pft"
    category: "mortality"

  FATES_MORTALITY_CSTARV_CFLUX_PF:
    long_name: "Carbon starvation mortality flux by PFT"
    units: "kg C m-2 s-1"
    dimension: "pft"
    category: "mortality"
    controlled_by:
